name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  GODOT_VERSION: "4.7.2"

jobs:
  simulation:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test flight model
        run: dotnet test tests/IronSkies.FlightModel.Tests -c Release --nologo

  game:
    name: Godot build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Godot (.NET)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$base/$zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          bin="/tmp/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          sudo ln -sf "$bin" /usr/local/bin/godot
          godot --version

      - name: Build C# assemblies
        run: dotnet build game/IronSkies.Game.csproj -c Debug --nologo

      - name: Smoke test (headless, 120 frames)
        run: godot --headless --path game scenes/Main.tscn --quit-after 120
      - name: Mission completion test
        run: |
          output=$(godot --headless --path game scenes/Main.tscn -- --mission-test)
          echo "$output"
          echo "$output" | grep -q "\[mission-test\] complete=True"

      - name: Multiplayer smoke test (server + 2 clients)
        run: ./tools/net_smoke_test.sh
      - name: Password authentication test
        run: ./tools/net_auth_test.sh

  licences:
    name: Asset licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check asset register
        run: python3 tools/check_licenses.py
