name: Export builds

# Manual: builds Linux and Windows release packages with the .NET (mono) templates.
# Normal CI does not download the 1.2 GB template pack.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Linux + Windows packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Godot (.NET)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$base/$zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          bin="/tmp/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          sudo ln -sf "$bin" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/

      - name: Export Linux + Windows
        run: ./tools/export_builds.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: iron-skies-linux-windows
          path: build/
          if-no-files-found: error
