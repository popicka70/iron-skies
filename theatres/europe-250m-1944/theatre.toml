# Europe-wide 250 m height layer over the 500 m continental detail.
id = "europe-250m-1944"
name = "Europe 250 m detail"
description = "Copernicus GLO-90 250 m continental height layer with Blue Marble 8k imagery."
generator_version = "0.4"
seed = 19440606

[geodesy]
crs = "EPSG:32630"
origin = { lat = 49.2200, lon = -0.3700 }
bounds = { north = 68.0, south = 29.0, west = -40.0, east = 40.0 }
vertical_datum = "EGM2008"

[terrain]
size_meters = 4000000
chunk_size_m = 1000
lod_levels = 5
heightmap_spacing_m = 250
dem_source = "copernicus-glo90"
ortho_source = "blue-marble"
ortho_size = 8192
heightmap_bits = 16
# Copernicus DEM is land-only; the UTM square includes Atlantic/Mediterranean
# water, so allow that fraction of no-data pixels and fill them below the water plane.
missing_dem_percent = 20

[runtime]
default_weather = "broken"
time_of_day = "09:30"

[[sources]]
id = "copernicus-glo90"
kind = "elevation"
licence = "Copernicus DEM licence (free, attribution)"
attribution = "© DLR e.V. 2010-2014 and © Airbus DS GmbH 2017-2021"
resolution_m = 90

[[sources]]
id = "nasa-blue-marble"
kind = "imagery"
licence = "Public domain (NASA)"
attribution = "NASA Earth Observatory Blue Marble, via NASA GIBS"
resolution_m = 500

[[sources]]
id = "polyhaven-materials"
kind = "materials"
licence = "CC0"
attribution = "Poly Haven (polyhaven.com)"
notes = "Textures only; no geospatial component"
