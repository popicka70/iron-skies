# Streamed 90 m Copernicus GLO-90 height tiles over the 4,000 km Europe grid.
# Built by tools/build_height_tiles.py; tiles are 713² samples with a one-pixel
# overlap (64,080 m stride) so the runtime streams a 3×3 ring around the player.
id = "europe-90m-tiles-1944"
name = "Europe 90 m height tiles"
description = "Copernicus GLO-90 90 m height tiles (64 km) for the streamed near field."
generator_version = "0.1"
seed = 19440606

[geodesy]
crs = "EPSG:32630"
origin = { lat = 49.2200, lon = -0.3700 }
bounds = { north = 68.0, south = 29.0, west = -40.0, east = 40.0 }
vertical_datum = "EGM2008"

[terrain]
size_meters = 4000000
chunk_size_m = 1000
lod_levels = 5
tile_spacing_m = 90
tile_stride = 712
tiles_per_axis = 63
heightmap_bits = 16
dem_source = "copernicus-glo90"

[runtime]
default_weather = "broken"
time_of_day = "09:30"

[[sources]]
id = "copernicus-glo90"
kind = "elevation"
licence = "Copernicus DEM licence (free, attribution)"
attribution = "© DLR e.V. 2010-2014 and © Airbus DS GmbH 2017-2021"
resolution_m = 90

[[sources]]
