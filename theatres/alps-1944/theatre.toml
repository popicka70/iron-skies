# Alps — 400 km high-resolution mountain layer over the Europe base.
# Same UTM zone as the base so offsets and detail insets align exactly.
id = "alps-1944"
name = "Alps, 1944"
description = "A 400 km Alpine layer built from Copernicus GLO-30 at 50 m, composited over the 4,000 km Europe base."
generator_version = "0.3"
seed = 19440606

[geodesy]
crs = "EPSG:32630"
origin = { lat = 46.50, lon = 10.00 }
bounds = { north = 48.8, south = 44.2, west = 6.5, east = 13.5 }
vertical_datum = "EGM2008"

[terrain]
size_meters = 400000
chunk_size_m = 1000
lod_levels = 5
heightmap_spacing_m = 50
dem_source = "copernicus-glo30"
ortho_source = "blue-marble"
ortho_size = 4096
heightmap_bits = 16

[runtime]
default_weather = "broken"
time_of_day = "09:30"

